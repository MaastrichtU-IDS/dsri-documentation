---
# JupyterLab with OpenShift login (oauth-proxy)
#
# Route -> Service :4180 -> oauth-proxy -> JupyterLab 127.0.0.1:8888
# The proxy sends users to the OpenShift login, checks they have access to
# this project, then forwards them to JupyterLab. No token or password.
#
# Changes for the oauth-proxy are marked with [oauth-proxy].
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: jupyterlab-root
  annotations:
    openshift.io/display-name: JupyterLab
    description: |-
      Start JupyterLab images based on the official Docker stack, as the `jovyan` user, with sudo privileges to install anything you need.
      🔑 Login is handled by your DSRI (OpenShift) account: no token or password needed.
      The first time you open a new workspace, OpenShift asks you to "Authorize Access": click "Allow selected permissions".

      🐳 You can use any image based on the official Jupyter docker stack:
      - ghcr.io/maastrichtu-ids/jupyterlab (with VSCode, Java and SPARQL kernels)
      - ghcr.io/maastrichtu-ids/jupyterlab:knowledge-graph (with VSCode, Java, SPARQL kernels and KG tools)
      - jupyter/minimal-notebook
      - jupyter/scipy-notebook
      - jupyter/datascience-notebook (with Julia kernel)
      - jupyter/tensorflow-notebook
      - jupyter/r-notebook
      - jupyter/pyspark-notebook
      - jupyter/all-spark-notebook
      - elyra/elyra (extension for Kuberflow pipelines)

      Checkout https://github.com/MaastrichtU-IDS/jupyterlab to see how our custom image is built, and how to extend it
      For more details on the jupyter docker stack, go to https://github.com/jupyter/docker-stacks

      🔥 With our ghcr.io/maastrichtu-ids/jupyterlab image you can provide the URL to a git repository which will be cloned in your workspace at the start of JupyterLab.
      If this repo contains files with list of packages in the root folder, they will be installed at start:
      - requirements.txt for pip packages
      - packages.txt for apt packages
      You can use this URL to clone a repository with some examples to use the DSRI:
      https://github.com/MaastrichtU-IDS/dsri-demo

      📂 Use the persistent folder in the workspace of the JupyterLab UI (usually /home/jovyan/work/persistent folder) to store your data in the persistent storage automatically created
      You can find the persistent storage in the DSRI web UI, go to Search > Resources > Persistent Volume Claim.

      🗑️ Use this command with your application name to delete completely your application and its persistent volumes:
      oc delete all,pvc,secret,configmaps,serviceaccount,rolebinding --selector app=$APPLICATION_NAME

      ⚠️ JupyterLab is fronted by an OpenShift oauth-proxy sidecar instead of the built-in token.
    iconClass: icon-python
    tags: python,jupyter,notebook
    openshift.io/provider-display-name: Research Computing Support, UM
    openshift.io/documentation-url: https://maastrichtu-ids.github.io/dsri-documentation/docs/deploy-jupyter
    openshift.io/support-url: https://maastrichtu-ids.github.io/dsri-documentation/help
labels:
  template: jupyterlab-root

parameters:
  - name: APPLICATION_NAME
    displayName: Name for the application
    description: Must be without spaces (use -), and unique in the project.
    value: jupyterlab
    required: true
  - name: APPLICATION_IMAGE
    displayName: Jupyter notebook Docker image
    description: Check the description on the right for more details about available images
    value: ghcr.io/maastrichtu-ids/jupyterlab:latest
    required: true
  - name: STORAGE_SIZE
    displayName: Storage size
    description: Size of the storage allocated to the notebook persistent storage.
    value: 5Gi
    required: true

  # [oauth-proxy] TODO before prod: pin this instead of using :latest.
  # Get the cluster's own oauth-proxy image with:
  #   oc adm release info --image-for=oauth-proxy
  # (dev, OKD 4.19.0-okd-scos.7: quay.io/okd/scos-content@sha256:def78a66ff1dc8214db7120c84745399eb47d3c329b5b2fe9931d3db787c518e)
  - name: OAUTH_PROXY_IMAGE
    displayName: oauth-proxy image
    description: Image used for the login proxy
    value: quay.io/openshift/origin-oauth-proxy:latest
    required: true

  #Custom parameters
  - name: GIT_URL
    displayName: URL of a git repository to clone in the workspace (optional)
    description: It will be automatically cloned, then requirements.txt and packages.txt will be automatically installed if presents. Only works for images based on the official images
    required: false
  - name: GIT_NAME
    displayName: Git name
    description: Email used to automatically define git config --global user.name
    value: default
    required: true
  - name: GIT_EMAIL
    displayName: Git email
    description: Email used to automatically define git config --global user.email
    value: default@maastrichtuniversity.nl
    required: true

objects:
  - kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
        template: jupyterlab-root
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: ${STORAGE_SIZE}
      storageClassName: ocs-storagecluster-cephfs

  # [oauth-proxy] Login identity used by the proxy
  # The annotation tells OpenShift where to send users back after login.
  - kind: ServiceAccount
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}-oauth"
      labels:
        app: "${APPLICATION_NAME}"
        template: jupyterlab-root
      annotations:
        serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"${APPLICATION_NAME}"}}'

  # [oauth-proxy] Token for the service account above. OpenShift fills it in.
  - kind: Secret
    apiVersion: v1
    type: kubernetes.io/service-account-token
    metadata:
      name: "${APPLICATION_NAME}-oauth-token"
      labels:
        app: "${APPLICATION_NAME}"
        template: jupyterlab-root
      annotations:
        kubernetes.io/service-account.name: "${APPLICATION_NAME}-oauth"

  # [oauth-proxy] Points to the proxy (4180) instead of JupyterLab (8888).
  - kind: Service
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
        template: jupyterlab-root
    spec:
      selector:
        app: "${APPLICATION_NAME}"
      ports:
        - name: "oauth-proxy"
          protocol: TCP
          port: 4180
          targetPort: 4180
      type: ClusterIP

  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
        template: jupyterlab-root
    spec:
      to:
        kind: Service
        name: "${APPLICATION_NAME}"
      port:
        targetPort: "oauth-proxy"   # [oauth-proxy]
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
        template: jupyterlab-root
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: "${APPLICATION_NAME}"
      template:
        metadata:
          annotations:
            io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
          labels:
            app: "${APPLICATION_NAME}"
            deployment: "${APPLICATION_NAME}"
        spec:
          runtimeClassName: selinux
          serviceAccountName: "anyuid"
          automountServiceAccountToken: false   # no token in the user's container
          securityContext:
            runAsUser: 0
            fsGroup: 100

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: "${APPLICATION_NAME}"
            # [oauth-proxy] Token + CA certificates for the proxy only.
            - name: oauth-sa
              projected:
                sources:
                  - secret:
                      name: "${APPLICATION_NAME}-oauth-token"
                      items:
                        - key: token
                          path: token
                        - key: namespace
                          path: namespace
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - configMap:
                      name: openshift-service-ca.crt
                      items:
                        - key: service-ca.crt
                          path: service-ca.crt
            # [oauth-proxy] In-memory storage for the cookie secret.
            - name: cookie-secret
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi

          # [oauth-proxy] Generates a random key to sign login cookies.
          # New on every pod start; users just pass the OpenShift login again.
          initContainers:
            - name: generate-cookie-secret
              image: "${APPLICATION_IMAGE}"
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
                - "import secrets; open('/cookie/secret', 'w').write(secrets.token_hex(16))"
              volumeMounts:
                - name: cookie-secret
                  mountPath: /cookie
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

          containers:
            # ---------------- JupyterLab ----------------
            - name: "${APPLICATION_NAME}"
              image: "${APPLICATION_IMAGE}"
              imagePullPolicy: IfNotPresent
              workingDir: /home/jovyan/work
              # [oauth-proxy] Image's default command plus flags below.
              # start.sh still runs first and switches to jovyan (with sudo).
              args:
                - start-notebook.sh
                - --no-browser
                - --config=/etc/jupyter/jupyter_notebook_config.py
                - --ServerApp.token=                    # login handled by the proxy
                - --ServerApp.password=
                - --ServerApp.ip=127.0.0.1              # only reachable via the proxy
                - --ServerApp.allow_remote_access=True  # accept the Route hostname
              ports:
                - containerPort: 4040
                  protocol: TCP
                - containerPort: 4041
                  protocol: TCP
              volumeMounts:
                - name: data
                  mountPath: /home/jovyan/work/persistent
              env:
                - name: JUPYTER_ENABLE_LAB
                  value: "yes"
                - name: GRANT_SUDO
                  value: "yes"
                - name: GIT_URL
                  value: "${GIT_URL}"
                - name: GIT_NAME
                  value: "${GIT_NAME}"
                - name: GIT_EMAIL
                  value: "${GIT_EMAIL}"
              # [oauth-proxy] Checked from inside the container (app listens on 127.0.0.1).
              readinessProbe:
                exec:
                  command: ["python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8888), 2)"]
                timeoutSeconds: 5
              livenessProbe:
                exec:
                  command: ["python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8888), 2)"]
                initialDelaySeconds: 15
                failureThreshold: 40
                periodSeconds: 10
                timeoutSeconds: 5
              resources:
                requests:
                  cpu: '2'
                  memory: 4Gi
                  ephemeral-storage: 2Gi
                limits:
                  cpu: '32'
                  memory: 200Gi
                  ephemeral-storage: 50Gi

            # ---------------- [oauth-proxy] Login proxy ----------------
            - name: oauth-proxy
              image: "${OAUTH_PROXY_IMAGE}"
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 4180
                  name: proxy-http
                  protocol: TCP
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              args:
                - --http-address=:4180                                   # TLS is done by the Route
                - --https-address=
                - --provider=openshift                                   # log in with OpenShift
                - --openshift-service-account=${APPLICATION_NAME}-oauth  # login identity
                - --upstream=http://127.0.0.1:8888                       # JupyterLab
                - --cookie-secret-file=/cookie/secret
                - --cookie-expire=24h                                    # same as the OpenShift token lifetime; 
                                                                         # access is re-checked at each login
                # Only users who can view pods in this project get in
                - --openshift-sar={"namespace":"$(POD_NAMESPACE)","resource":"pods","verb":"get"}
              volumeMounts:
                - name: oauth-sa
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
                - name: cookie-secret
                  mountPath: /cookie
                  readOnly: true
              readinessProbe:
                tcpSocket:
                  port: 4180
              livenessProbe:
                tcpSocket:
                  port: 4180
                initialDelaySeconds: 10
                periodSeconds: 10
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi