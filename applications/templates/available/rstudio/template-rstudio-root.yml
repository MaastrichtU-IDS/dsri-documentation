---
# RStudio with OpenShift login (oauth-proxy)
#
# Route -> Service :4180 -> oauth-proxy -> RStudio 127.0.0.1:8787
# The proxy sends users to the OpenShift login, checks they have access to
# this project, then forwards them to RStudio. No username or password.
# Shiny (3838) is not behind the proxy and stays public, as before.
#
# Changes for the oauth-proxy are marked with [oauth-proxy].
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: rstudio-root
  annotations:
    openshift.io/display-name: RStudio
    description: |-
      Start RStudio as the 'root' user, with root permissions to install anything you need.
      🔑 Login is handled by your DSRI (OpenShift) account: no username or password needed.
      The first time you open a new workspace, OpenShift asks you to "Authorize Access": click "Allow selected permissions".

      🐳 Available images with this template:
      bioconductor/bioconductor_docker:devel
      rocker/rstudio
      rocker/tidyverse
      ghcr.io/maastrichtu-ids/rstudio

      Images based on rocker can be deployed: https://hub.docker.com/r/rocker/rstudio/
      Visit https://github.com/MaastrichtU-IDS/rstudio for more details to build and customize the image

      📂 Use the /root/persistent folder to store your data in a persistent storage automatically created.
      You can find the persistent storage in the DSRI web UI, go to Administrator view > Storage > Persistent Volume Claims

      ⚠️ RStudio is fronted by an OpenShift oauth-proxy sidecar instead of the built-in login (RCS-1046).
    iconClass: icon-play
    tags: R,rstudio,root,persistent
    openshift.io/provider-display-name: Institute of Data Science, UM
    openshift.io/documentation-url: https://maastrichtu-ids.github.io/dsri-documentation/docs/deploy-rstudio
    openshift.io/support-url: https://maastrichtu-ids.github.io/dsri-documentation/help
labels:
  template: rstudio-root

parameters:
  - name: APPLICATION_NAME
    displayName: Application name
    description: Must be without spaces (use -), and unique in the project.
    value: rstudio
    required: true
  - name: APPLICATION_IMAGE
    displayName: RStudio Docker image
    description: Check on the right to see which images can be used to start RStudio
    value: ghcr.io/maastrichtu-ids/rstudio:latest
    required: true
  - name: STORAGE_SIZE
    displayName: Storage size
    description: Size of the storage used for the notebook (approximate).
    value: 10Gi
    required: true
  - name: OPENBLAS_NUM_THREADS
    displayName: Number of threads for OpenBLAS
    description: Restricting the number of thread allocated to OpenBLAS can speed up computations using OpenBLAS (leave empty for default 64)
    value: "1"
    required: false

  # [oauth-proxy] TODO before prod: pin this instead of using :latest.
  # Get the cluster's own oauth-proxy image with:
  #   oc adm release info --image-for=oauth-proxy
  # (dev, OKD 4.19.0-okd-scos.7: quay.io/okd/scos-content@sha256:def78a66ff1dc8214db7120c84745399eb47d3c329b5b2fe9931d3db787c518e)
  - name: OAUTH_PROXY_IMAGE
    displayName: oauth-proxy image
    description: Image used for the login proxy. Leave as is.
    value: quay.io/openshift/origin-oauth-proxy:latest
    required: true

objects:
  - kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: ${STORAGE_SIZE}
      storageClassName: ocs-storagecluster-cephfs

  # [oauth-proxy] Login identity used by the proxy, one per workspace.
  # The annotation tells OpenShift where to send users back after login.
  - kind: ServiceAccount
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}-oauth"
      labels:
        app: "${APPLICATION_NAME}"
      annotations:
        serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"${APPLICATION_NAME}"}}'

  # [oauth-proxy] Token for the service account above. OpenShift fills it in.
  - kind: Secret
    apiVersion: v1
    type: kubernetes.io/service-account-token
    metadata:
      name: "${APPLICATION_NAME}-oauth-token"
      labels:
        app: "${APPLICATION_NAME}"
      annotations:
        kubernetes.io/service-account.name: "${APPLICATION_NAME}-oauth"

  # [oauth-proxy] Points to the proxy (4180) instead of RStudio (8787).
  - kind: Service
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
    spec:
      selector:
        app: "${APPLICATION_NAME}"
      ports:
        - name: "oauth-proxy"
          protocol: TCP
          port: 4180
          targetPort: 4180

  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
      annotations:
        haproxy.router.openshift.io/timeout: 10m
    spec:
      to:
        kind: Service
        name: "${APPLICATION_NAME}"
      port:
        targetPort: "oauth-proxy"   # [oauth-proxy]
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: "${APPLICATION_NAME}"
      labels:
        app: "${APPLICATION_NAME}"
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: "${APPLICATION_NAME}"
      template:
        metadata:
          annotations:
            io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
            alpha.image.policy.openshift.io/resolve-names: "*"
          labels:
            app: "${APPLICATION_NAME}"
            deployment: "${APPLICATION_NAME}"
        spec:
          runtimeClassName: selinux
          serviceAccountName: anyuid
          automountServiceAccountToken: false   # no token in the user's container

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: "${APPLICATION_NAME}"
            - name: rserver-config
              configMap:
                name: "${APPLICATION_NAME}-config"
                items:
                - key: rserver.conf
                  path: rserver.conf
            # [oauth-proxy] Token + CA certificates for the proxy only.
            - name: oauth-sa
              projected:
                sources:
                  - secret:
                      name: "${APPLICATION_NAME}-oauth-token"
                      items:
                        - key: token
                          path: token
                        - key: namespace
                          path: namespace
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - configMap:
                      name: openshift-service-ca.crt
                      items:
                        - key: service-ca.crt
                          path: service-ca.crt
            # [oauth-proxy] In-memory storage for the cookie secret.
            - name: cookie-secret
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi

          # [oauth-proxy] Generates a random key to sign login cookies.
          # New on every pod start; users just pass the OpenShift login again.
          # Uses only basic shell tools: RStudio images don't always have python3.
          initContainers:
            - name: generate-cookie-secret
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - "head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /cookie/secret"
              volumeMounts:
                - name: cookie-secret
                  mountPath: /cookie
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

          containers:
            # ---------------- RStudio ----------------
            - name: ${APPLICATION_NAME}
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: Always
              ports:
                - containerPort: 3838   # Shiny
                  protocol: TCP
              volumeMounts:
                - name: data
                  mountPath: "/root/persistent"
                - mountPath: /etc/rstudio/rserver.conf
                  subPath: rserver.conf
                  name: rserver-config
              env:
                # [oauth-proxy] User the R session runs as, now that login is off.
                # Was "rstudio", which doesn't exist in our image.
                - name: USER
                  value: "root"
                # [oauth-proxy] The image still expects a password at startup.
                # Pod UID: random, never shown in the form, never needed by users.
                - name: PASSWORD
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: ROOT
                  value: "TRUE"
                - name: RUNROOTLESS
                  value: 'true'
                - name: OPENBLAS_NUM_THREADS
                  value: "${OPENBLAS_NUM_THREADS}"
              resources:
                requests:
                  cpu: '2'
                  memory: 4Gi
                  ephemeral-storage: 2Gi
                limits:
                  cpu: '32'
                  memory: 200Gi
                  ephemeral-storage: 50Gi

            # ---------------- [oauth-proxy] Login proxy ----------------
            - name: oauth-proxy
              image: "${OAUTH_PROXY_IMAGE}"
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 4180
                  name: proxy-http
                  protocol: TCP
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              args:
                - --http-address=:4180                                   # TLS is done by the Route
                - --https-address=
                - --provider=openshift                                   # log in with OpenShift
                - --openshift-service-account=${APPLICATION_NAME}-oauth  # login identity
                - --upstream=http://127.0.0.1:8787                       # RStudio
                - --cookie-secret-file=/cookie/secret
                - --cookie-expire=24h                                    # same as the OpenShift token lifetime; 
                                                                         # access is re-checked at each login
                # Only users who can view pods in this project get in
                - --openshift-sar={"namespace":"$(POD_NAMESPACE)","resource":"pods","verb":"get"}
              volumeMounts:
                - name: oauth-sa
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
                - name: cookie-secret
                  mountPath: /cookie
                  readOnly: true
              readinessProbe:
                tcpSocket:
                  port: 4180
              livenessProbe:
                tcpSocket:
                  port: 4180
                initialDelaySeconds: 10
                periodSeconds: 10
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

  # RStudio server configuration
  - kind: ConfigMap
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}-config"
      labels:
        app: "${APPLICATION_NAME}"
    data:
      rserver.conf: |
        rsession-which-r=/usr/local/bin/R
        auth-minimum-user-id=0

        # Fix for the session timeout issue (300s)
        rsession-proxy-max-wait-secs=300

        # [oauth-proxy] RStudio login off, the proxy handles it.
        # Set here, not with DISABLE_AUTH=true: that would try to write to this read-only file.
        auth-none=1

        # [oauth-proxy] Only reachable via the proxy.
        www-address=127.0.0.1

  # Shiny Server: unchanged, not behind the proxy (public, as before)
  - kind: Service
    apiVersion: v1
    metadata:
      name: "${APPLICATION_NAME}-shiny"
      labels:
        app: "${APPLICATION_NAME}"
    spec:
      ports:
      - name: 3838-tcp
        protocol: TCP
        port: 3838
        targetPort: 3838
      selector:
        app: "${APPLICATION_NAME}"

  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: "${APPLICATION_NAME}-shiny"
      labels:
        app: "${APPLICATION_NAME}"
      annotations:
        haproxy.router.openshift.io/timeout: 10m
    spec:
      to:
        kind: Service
        name: "${APPLICATION_NAME}-shiny"
      port:
        targetPort: 3838-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect