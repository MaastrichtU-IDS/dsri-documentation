---
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: rstudio-bioconductor
  annotations:
    openshift.io/display-name: RStudio with Bioconductor
    description: |-
      RStudio IDE with Bioconductor package installed for R-based bioinformatics analysis.

      This template provides the Bioconductor 3.21 suite with R 4.5.2, suitable for genomics workflows including single-cell RNA sequencing analysis.
      You can install packages like Seurat as needed.

      🔑 Default credentials are
      - login: root
      - password: $user_password

      📂 Use the /root/persistent folder to store your data in a persistent storage automatically created.
      R packages, temporary files and RStudio session state are also stored there.
      You can find the persistent storage in the DSRI web UI, go to Administrator view > Storage > Persistent Volume Claims
    iconClass: icon-play
    tags: bioconductor,R,rstudio,root,persistent
    openshift.io/provider-display-name: Research Computing Support, UM
    openshift.io/support-url: https://maastrichtu-ids.github.io/dsri-documentation/help
labels:
  template: rstudio-bioconductor

parameters:
- name: APPLICATION_NAME
  displayName: Application name
  description: Must be without spaces (use -), and unique in the project.
  value: rstudio-bioconductor
  required: true
- name: APPLICATION_IMAGE
  displayName: Bioconductor Docker image
  description: Internal mirror to avoid Docker Hub rate limits
  value: ghcr.io/maastrichtu-ids/bioconductor-rstudio:3.21
  required: true
- name: STORAGE_SIZE
  displayName: Storage size
  description: Size of the storage used for the notebook (approximate).
  value: 10Gi
  required: true
- name: PASSWORD
  displayName: RStudio password
  description: The password of the RStudio user.
  required: true

objects:
- kind: PersistentVolumeClaim
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  spec:
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: ${STORAGE_SIZE}
    storageClassName: ocs-storagecluster-cephfs

- kind: Service
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  spec:
    ports:
    - name: 8787-tcp
      protocol: TCP
      port: 8787
      targetPort: 8787
    selector:
      app: "${APPLICATION_NAME}"
      deployment: "${APPLICATION_NAME}"

- kind: Route
  apiVersion: route.openshift.io/v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
    annotations:
      haproxy.router.openshift.io/timeout: 10m
  spec:
    host: ''
    to:
      kind: Service
      name: "${APPLICATION_NAME}"
      weight: 100
    port:
      targetPort: 8787-tcp
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

- kind: Secret
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  stringData:
    application-password: "${PASSWORD}"

- kind: ConfigMap
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}-config"
    labels:
      app: "${APPLICATION_NAME}"
  data:
    rserver.conf: |
      rsession-which-r=/usr/local/bin/R
      auth-minimum-user-id=0
      rsession-proxy-max-wait-secs=300

# ConfigMap to change directories used to store session state
- kind: ConfigMap
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}-rstudio-prefs"
    labels:
      app: "${APPLICATION_NAME}"
  data:
    rstudio-prefs.json: |
      {
        "initial_working_directory": "/root/persistent",
        "default_project_location": "/root/persistent",
        "default_open_project_location": "/root/persistent",
        "save_workspace": "always",
        "load_workspace": true
      }

- kind: Deployment
  apiVersion: apps/v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  spec:
    strategy:
      type: Recreate
    replicas: 1
    selector:
      matchLabels:
        app: "${APPLICATION_NAME}"
        deployment: "${APPLICATION_NAME}"
    template:
      metadata:
        annotations:
          io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
          alpha.image.policy.openshift.io/resolve-names: "*"
        labels:
          app: "${APPLICATION_NAME}"
          deployment: "${APPLICATION_NAME}"
      spec:
        runtimeClassName: selinux
        serviceAccountName: anyuid
        automountServiceAccountToken: false
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "${APPLICATION_NAME}"
        - name: rserver-config
          configMap:
            name: "${APPLICATION_NAME}-config"
            items:
            - key: rserver.conf
              path: rserver.conf
        - name: rstudio-prefs
          configMap:
            name: "${APPLICATION_NAME}-rstudio-prefs"
        # Create the persistent directories before RStudio starts
        initContainers:
        - name: init-persistent-dirs
          image: ${APPLICATION_IMAGE}
          command:
          - sh
          - -c
          - mkdir -p /root/persistent/tmp /root/persistent/.rstudio-data /root/persistent/.cache /root/persistent/R/library
          volumeMounts:
          - name: data
            mountPath: "/root/persistent"
        containers:
        - name: "${APPLICATION_NAME}"
          image: ${APPLICATION_IMAGE}
          imagePullPolicy: Always
          ports:
          - containerPort: 8787
            protocol: TCP
          resources:
            limits:
              cpu: '32'
              memory: 200Gi
              ephemeral-storage: 50Gi
            requests:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: data
            mountPath: "/root/persistent"
          - name: rserver-config
            mountPath: /etc/rstudio/rserver.conf
            subPath: rserver.conf
          - name: rstudio-prefs
            mountPath: /etc/rstudio/rstudio-prefs.json
            subPath: rstudio-prefs.json
          env:
          - name: USER
            value: "root"
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                key: application-password
                name: "${APPLICATION_NAME}"
          - name: ROOT
            value: "TRUE"
          - name: RUNROOTLESS
            value: 'true'
          - name: TMPDIR
            value: /root/persistent/tmp
          - name: R_LIBS
            value: /root/persistent/R/library:/usr/local/lib/R/site-library:/usr/local/lib/R/library
          - name: RSTUDIO_DATA_HOME
            value: /root/persistent/.rstudio-data
          - name: XDG_CACHE_HOME
            value: /root/persistent/.cache