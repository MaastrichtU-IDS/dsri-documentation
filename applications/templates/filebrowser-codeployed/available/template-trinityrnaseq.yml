---
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: trinityrnaseq
  annotations:
    openshift.io/display-name: Trinity RNA-Seq
    description: |-
      Start trinityrnaseq with the 'root' user which has sudo permissions to install anything.

      📂 Use the `/usr/local/src/work` folder (home of the root user) to store your data in the existing persistent storage
      You can find the persistent storage in the DSRI web UI, go to Administrator view > Storage > Persistent Volume Claims
      🔗 We enabled the port 8787 in the trinityrnaseq container if you need to deploy applications
      
      Image from https://github.com/trinityrnaseq/trinityrnaseq, hosted in the GitHub Container Registry.

      📂 A FileBrowser is co-deployed to manage your files via a web UI.
      Login with admin and the password you set below.
      The storage is organised as /persistent/source, /persistent/results, /persistent/scripts.
    iconClass: icon-scala
    tags: trinityrnaseq,persistent,omics
    openshift.io/provider-display-name: Institute of Data Science, UM
    openshift.io/documentation-url: https://maastrichtu-ids.github.io/dsri-documentation/docs/catalog-genomics
    openshift.io/support-url: https://maastrichtu-ids.github.io/dsri-documentation/help
labels:
  template: trinityrnaseq
message: |-
  A trinityrnaseq pod has been scheduled for creation in your project, and should be soon available.
  Building images takes some minutes to complete, so please be patient. You can follow progress on your projects overview page.

  You can use `oc get pods` to get the pod ID and connect using your local terminal `oc rsh POD_ID`
  Or use the terminal tab in the trinityrnaseq pod view of the OpenShift web UI

parameters:
- name: APPLICATION_NAME
  displayName: Application name
  description: Must be without spaces (use -), and unique in the project.
  value: trinityrnaseq
  required: true
- name: APPLICATION_IMAGE
  displayName: Application Docker image
  description: See https://github.com/orgs/MaastrichtU-IDS/packages/container/package/trinityrnaseq for more details on the image
  value: ghcr.io/maastrichtu-ids/trinityrnaseq
  required: true
- name: STORAGE_SIZE
  displayName: Storage size
  description: Size of the storage used for the notebook (approximate).
  value: 10Gi
  required: true
- name: PASSWORD
  displayName: FileBrowser password
  description: The password to access the co-deployed FileBrowser web UI
  value: browsemeplease
  required: true

objects:
- kind: "PersistentVolumeClaim"
  apiVersion: "v1"
  metadata:
    name: ${APPLICATION_NAME}
    labels:
      app: "${APPLICATION_NAME}"
  spec:
    accessModes:
      - "ReadWriteMany"
    resources:
      requests:
        storage: ${STORAGE_SIZE}
    storageClassName: ocs-storagecluster-cephfs

- kind: Secret
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  stringData:
    application-password: "${PASSWORD}"

- kind: Deployment
  apiVersion: apps/v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  spec:
    strategy:
      type: Recreate
    replicas: 1
    selector:
      matchLabels:
        app: "${APPLICATION_NAME}"
        deployment: "${APPLICATION_NAME}"
    template:
      metadata:
        annotations:
          io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
        labels:
          app: "${APPLICATION_NAME}"
          deployment: "${APPLICATION_NAME}"
      spec:
        runtimeClassName: selinux
        serviceAccountName: anyuid
        # FileBrowser folder layout
        initContainers:
        - name: init-dirs
          image: busybox
          command: ["sh", "-c", "mkdir -p /persistent/source /persistent/results /persistent/scripts && chmod -R 777 /persistent"]
          volumeMounts:
            - name: data
              mountPath: /persistent
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "${APPLICATION_NAME}"
        containers:
        - name: "${APPLICATION_NAME}"
          image: "${APPLICATION_IMAGE}"
          imagePullPolicy: Always
          command: [ "tail", "-f", "/dev/null"]
          ports:
          - containerPort: 8787
            protocol: TCP
          resources:
            limits:
              cpu: '32'
              memory: 200Gi
              ephemeral-storage: 50Gi
            requests:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: data
            mountPath: "/usr/local/src/work"
        automountServiceAccountToken: false

# === FileBrowser ===
- kind: Service
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}-filebrowser"
    labels:
      app: "${APPLICATION_NAME}-filebrowser"
  spec:
    selector:
      app: "${APPLICATION_NAME}-filebrowser"
    ports:
      - name: "80-tcp"
        protocol: TCP
        port: 80
        targetPort: 80
    type: ClusterIP

- kind: Route
  apiVersion: route.openshift.io/v1
  metadata:
    name: "${APPLICATION_NAME}-filebrowser"
    labels:
      app: "${APPLICATION_NAME}-filebrowser"
  spec:
    to:
      kind: Service
      name: "${APPLICATION_NAME}-filebrowser"
    port:
      targetPort: "80-tcp"
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

- kind: Deployment
  apiVersion: apps/v1
  metadata:
    name: "${APPLICATION_NAME}-filebrowser"
    labels:
      app: "${APPLICATION_NAME}-filebrowser"
  spec:
    replicas: 1
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: "${APPLICATION_NAME}-filebrowser"
    template:
      metadata:
        annotations:
          io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
        labels:
          app: "${APPLICATION_NAME}-filebrowser"
          deployment: "${APPLICATION_NAME}-filebrowser"
      spec:
        runtimeClassName: selinux
        serviceAccountName: anyuid
        automountServiceAccountToken: false
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: "${APPLICATION_NAME}"
          - name: filebrowser-db
            emptyDir: {}
        # Seed the FileBrowser database with an admin user using the password
        # from the app Secret, so both stay in sync when the template is instantiated.
        # The filebrowser image has no shell, so each step is its own initContainer
        # calling the binary directly via `args` (the image's own entrypoint),
        # not `command`, since that binary is not on $PATH.
        initContainers:
          - name: init-filebrowser-db
            image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
            args:
              - "-d"
              - "/database/filebrowser.db"
              - "config"
              - "init"
            volumeMounts:
              - name: filebrowser-db
                mountPath: /database
          - name: init-filebrowser-user
            image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
            args:
              - "-d"
              - "/database/filebrowser.db"
              - "users"
              - "add"
              - "admin"
              - "$(PASSWORD)"
              - "--perm.admin"
            env:
              - name: PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: application-password
                    name: "${APPLICATION_NAME}"
            volumeMounts:
              - name: filebrowser-db
                mountPath: /database
        containers:
          - name: filebrowser
            image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
            imagePullPolicy: IfNotPresent
            args:
              - "--root"
              - "/persistent"
              - "--database"
              - "/database/filebrowser.db"
            ports:
              - containerPort: 80
                protocol: TCP
            volumeMounts:
              - name: data
                mountPath: /persistent
              - name: filebrowser-db
                mountPath: /database
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: '1'
                memory: 2Gi
                ephemeral-storage: 5Gi