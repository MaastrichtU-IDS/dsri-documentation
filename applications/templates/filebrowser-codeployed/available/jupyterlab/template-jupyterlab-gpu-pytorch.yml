---
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  annotations:
    description: |-
      Start JupyterLab to run CUDA and PyTorch using a GPU
      with the root user.
      
      By default the GPU will not be enabled, so you can start
      this workspace to prepare your code and data. Once your the GPU has been enabled
      in your project, you can enable the GPU in your workspace with this command
      (replace jupyterlab-gpu-pytorch with the name of your deployment)
      
      oc patch deployment/jupyterlab-gpu-pytorch
      --type=json -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/resources",
      "value": {"requests": {"nvidia.com/gpu": 1}, "limits": {"nvidia.com/gpu": 1}}}]'
      
      📂 Use the `/workspace/persistent` folder (workspace of the JupyterLab UI) to store your data in the persistent
      storage
      
      Feel free to check how the GPU images are built and to customize them for your project:
      https://github.com/MaastrichtU-IDS/jupyterlab      
      
      📂 A FileBrowser is co-deployed to manage your files via a web UI.
      Login with admin and the same password you set for JupyterLab.
      The storage is organised as /data/source, /data/results, /data/scripts.

      🗑️
      Use this command with your application name to delete completely your application
      and its persistent volumes:
      oc delete all,pvc,secret,configmaps,serviceaccount,rolebinding
      --selector app=$APPLICATION_NAME
    iconClass: icon-python
    openshift.io/display-name: JupyterLab with PyTorch on GPU
    openshift.io/documentation-url: https://maastrichtu-ids.github.io/dsri-documentation/docs/deploy-on-gpu
    openshift.io/provider-display-name: Research Computing Support, UM
    openshift.io/support-url: https://maastrichtu-ids.github.io/dsri-documentation/help
    tags: python,jupyter,gpu,pytorch
  name: jupyterlab-gpu-pytorch
  namespace: openshift
  labels:
    template: jupyterlab-gpu-pytorch

parameters:
- name: APPLICATION_NAME
  description: Must be unique in the project. It will be used to generate the application URL.
  displayName: Application name
  required: true
  value: jupyterlab-gpu-pytorch
- name: IMAGE_NAME
  description: Check the description on the right for more details about available images
  displayName: Docker image used
  required: true
  value: ghcr.io/maastrichtu-ids/jupyterlab:gpu-pytorch
- name: STORAGE_SIZE
  description: Size of the storage allocated to the notebook persistent storage in `/workspace/persistent`.
  displayName: Storage size
  required: true
  value: 20Gi

#Custom parameters 
- name: JUPYTER_TOKEN
  description: The password, aka. token, to access the notebook
  displayName: Notebook password
  required: true
- name: GIT_NAME
  description: Email used to automatically define git config --global user.name
  displayName: Git name
  required: true
  value: default
- name: GIT_EMAIL
  description: Email used to automatically define git config --global user.email
  displayName: Git email
  required: true
  value: default@maastrichtuniversity.nl
- name: IMAGE_PULL_POLICY
  description: Use Always to make sure the new image is pulled when you update it
  displayName: Image pull policy
  required: true
  value: Always

objects:
- kind: PersistentVolumeClaim
  apiVersion: v1
  metadata:
    labels:
      app: "${APPLICATION_NAME}"
    name: "${APPLICATION_NAME}"
  spec:
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: "${STORAGE_SIZE}"
    storageClassName: ocs-storagecluster-cephfs

- kind: Service
  apiVersion: v1
  metadata:
    labels:
      app: "${APPLICATION_NAME}"
    name: "${APPLICATION_NAME}"
  spec:
    ports:
    - name: 8888-tcp
      port: 8888
      protocol: TCP
      targetPort: 8888
    - name: 6006-tcp
      port: 6006
      protocol: TCP
      targetPort: 6006
    selector:
      app: "${APPLICATION_NAME}"
      deployment: "${APPLICATION_NAME}"

- kind: Route
  apiVersion: route.openshift.io/v1
  metadata:
    labels:
      app: "${APPLICATION_NAME}"
    name: "${APPLICATION_NAME}"
  spec:
    host: ''
    port:
      targetPort: 8888-tcp
    tls:
      insecureEdgeTerminationPolicy: Redirect
      termination: edge
    to:
      kind: Service
      name: "${APPLICATION_NAME}"
      weight: 100

- kind: Secret
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}"
    labels:
      app: "${APPLICATION_NAME}"
  stringData:
    application-password: "${JUPYTER_TOKEN}"

- kind: Deployment
  apiVersion: apps/v1
  metadata:
    labels:
      app: "${APPLICATION_NAME}"
    name: "${APPLICATION_NAME}"
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: "${APPLICATION_NAME}"
        deployment: "${APPLICATION_NAME}"
    strategy:
      type: RollingUpdate
    template:
      metadata:
        annotations: 
          io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
        labels:
          app: "${APPLICATION_NAME}"
          deployment: "${APPLICATION_NAME}"
      spec:
        runtimeClassName: selinux
        # FileBrowser folder layout
        initContainers:
        - name: init-dirs
          image: busybox
          command: ["sh", "-c", "mkdir -p /data/source /data/results /data/scripts && chmod -R 777 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
        containers:
        - env:
          - name: JUPYTER_TOKEN
            valueFrom:
              secretKeyRef:
                key: application-password
                name: "${APPLICATION_NAME}"
          - name: GIT_NAME
            value: "${GIT_NAME}"
          - name: GIT_EMAIL
            value: "${GIT_EMAIL}"
          - name: WORKSPACE
            value: "/workspace"
          - name: PERSISTENT_FOLDER
            value: "/workspace/persistent"
          image: "${IMAGE_NAME}"
          imagePullPolicy: "${IMAGE_PULL_POLICY}"
          name: "${APPLICATION_NAME}"
          ports:
          - containerPort: 8888
            protocol: TCP
          - containerPort: 6006
            protocol: TCP
          resources:
            limits:
              cpu: '64'
              memory: 256Gi
              ephemeral-storage: 50Gi
            requests:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
          - mountPath: "/workspace/persistent"
            name: data
          - mountPath: "/dev/shm"
            name: dshm
        serviceAccountName: anyuid
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "${APPLICATION_NAME}"
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

# === FileBrowser ===
- kind: Service
  apiVersion: v1
  metadata:
    name: "${APPLICATION_NAME}-filebrowser"
    labels:
      app: "${APPLICATION_NAME}-filebrowser"
  spec:
    selector:
      app: "${APPLICATION_NAME}-filebrowser"
    ports:
      - name: "80-tcp"
        protocol: TCP
        port: 80
        targetPort: 80
    type: ClusterIP

- kind: Route
  apiVersion: route.openshift.io/v1
  metadata:
    name: "${APPLICATION_NAME}-filebrowser"
    labels:
      app: "${APPLICATION_NAME}-filebrowser"
  spec:
    to:
      kind: Service
      name: "${APPLICATION_NAME}-filebrowser"
    port:
      targetPort: "80-tcp"
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

- kind: Deployment
  apiVersion: apps/v1
  metadata:
    name: "${APPLICATION_NAME}-filebrowser"
    labels:
      app: "${APPLICATION_NAME}-filebrowser"
  spec:
    replicas: 1
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: "${APPLICATION_NAME}-filebrowser"
    template:
      metadata:
        annotations:
          io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
        labels:
          app: "${APPLICATION_NAME}-filebrowser"
          deployment: "${APPLICATION_NAME}-filebrowser"
      spec:
        runtimeClassName: selinux
        serviceAccountName: anyuid
        automountServiceAccountToken: false
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: "${APPLICATION_NAME}"
          - name: filebrowser-db
            emptyDir: {}
        # Seed the FileBrowser database with an admin user using the same
        # password as the JupyterLab application (from the app Secret),
        # so both stay in sync when the template is instantiated.
        # The filebrowser image has no shell, so each step is its own initContainer
        # calling the binary directly via `args` (the image's own entrypoint),
        # not `command`, since that binary is not on $PATH.
        initContainers:
          - name: init-filebrowser-db
            image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
            args:
              - "-d"
              - "/database/filebrowser.db"
              - "config"
              - "init"
            volumeMounts:
              - name: filebrowser-db
                mountPath: /database
          - name: init-filebrowser-user
            image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
            args:
              - "-d"
              - "/database/filebrowser.db"
              - "users"
              - "add"
              - "admin"
              - "$(PASSWORD)"
              - "--perm.admin"
            env:
              - name: PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: application-password
                    name: "${APPLICATION_NAME}"
            volumeMounts:
              - name: filebrowser-db
                mountPath: /database
        containers:
          - name: filebrowser
            image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
            imagePullPolicy: IfNotPresent
            args:
              - "--root"
              - "/data"
              - "--database"
              - "/database/filebrowser.db"
            ports:
              - containerPort: 80
                protocol: TCP
            volumeMounts:
              - name: data
                mountPath: /data
              - name: filebrowser-db
                mountPath: /database
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: '1'
                memory: 2Gi
                ephemeral-storage: 5Gi