kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: ubuntu-vnc-halfpipe-filebrowser
  annotations:
    description: |-
      Start a minimal Ubuntu 22.04 Linux workspace with an LXDE desktop interface accessible directly in your browser. Additionally HALFPipe is deployed which can be accessed via the terminal.

      You will be the `root` user inside the containers.

      The Ubuntu and HALFPipe workspaces will share the same Persitent Volume Claim (PVC)!

      Use the `/root/persistent` folder to store your data in the Ubuntu workspace and us the `/home/fmriprep/data` in the HALFPipe workspace. Files kept in this directory are stored in persistent storage and will survive pod restarts.

      📂 A FileBrowser is co-deployed to manage your files via a web UI, useful for getting files in and out of the shared storage without going through the VNC desktop.
      Login with admin and the same password you set for Ubuntu.
      The storage is organised as /data/source, /data/results, /data/scripts, alongside your existing /root/persistent and /home/fmriprep/data content.

      Source code: https://github.com/MaastrichtU-Library/ubuntu-vnc
    iconClass: icon-ubuntu
    openshift.io/display-name: Ubuntu with desktop interface and HALFPipe (with FileBrowser)
    openshift.io/documentation-url: 'https://maastrichtu-ids.github.io/dsri-documentation/docs/catalog-utilities#ubuntu'
    openshift.io/provider-display-name: 'Research Computing Support, UM'
    openshift.io/support-url: 'https://maastrichtu-ids.github.io/dsri-documentation/help'
    tags: 'ubuntu,ui,vnc,root,persistent,halfpipe'
message: |-
  A Ubuntu pod has been scheduled for creation in your project, and should be soon available.
  Building images takes some minutes to complete, so please be patient. You can follow progress on your projects overview page.
objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app: '${APPLICATION_NAME}'
        template: ubuntu-vnc-halfpipe-filebrowser
      name: '${APPLICATION_NAME}'
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: '${STORAGE_SIZE}'
      storageClassName: ocs-storagecluster-cephfs
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: '${APPLICATION_NAME}'
        template: ubuntu-vnc-halfpipe-filebrowser
      name: '${APPLICATION_NAME}'
    spec:
      ports:
        - name: 6080-tcp
          port: 6080
          protocol: TCP
          targetPort: 80
      selector:
        app: '${APPLICATION_NAME}'
        deployment: '${APPLICATION_NAME}'
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      labels:
        app: '${APPLICATION_NAME}'
        template: ubuntu-vnc-halfpipe-filebrowser
      name: '${APPLICATION_NAME}'
    spec:
      host: ''
      port:
        targetPort: 6080-tcp
      tls:
        insecureEdgeTerminationPolicy: Redirect
        termination: edge
      to:
        kind: Service
        name: '${APPLICATION_NAME}'
        weight: 100
  - apiVersion: v1
    kind: Secret
    metadata:
      labels:
        app: '${APPLICATION_NAME}'
        template: ubuntu-vnc-halfpipe-filebrowser
      name: '${APPLICATION_NAME}'
    stringData:
      application-password: '${PASSWORD}'
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: '${APPLICATION_NAME}'
        template: ubuntu-vnc-halfpipe-filebrowser
      name: '${APPLICATION_NAME}'
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: '${APPLICATION_NAME}'
          deployment: '${APPLICATION_NAME}'
      strategy:
        type: Recreate
      template:
        metadata:
          annotations:
            io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
          labels:
            app: '${APPLICATION_NAME}'
            deployment: '${APPLICATION_NAME}'
        spec:
          automountServiceAccountToken: false
          # FileBrowser folder layout
          initContainers:
            - name: init-dirs
              image: busybox
              command: ["sh", "-c", "mkdir -p /data/source /data/results /data/scripts && chmod -R 777 /data"]
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - env:
                - name: MOZ_DISABLE_CONTENT_SANDBOX
                  value: '1'
                - name: HTTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: application-password
                      name: '${APPLICATION_NAME}'
                - name: VNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: application-password
                      name: '${APPLICATION_NAME}'
                - name: PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: application-password
                      name: '${APPLICATION_NAME}'
              image: '${APPLICATION_IMAGE}'
              imagePullPolicy: IfNotPresent
              name: '${APPLICATION_NAME}'
              ports:
                - containerPort: 80
                  protocol: TCP
                - containerPort: 5900
                  protocol: TCP
              resources:
                limits:
                  cpu: '32'
                  memory: 200Gi
                  ephemeral-storage: 50Gi
                requests:
                  cpu: '2'
                  memory: 4Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - mountPath: /root/persistent
                  name: data
          runtimeClassName: selinux
          serviceAccountName: anyuid
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: '${APPLICATION_NAME}'
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: 'halfpipe'
        template: ubuntu-vnc-halfpipe-filebrowser
      name: 'halfpipe'
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: 'halfpipe'
          deployment: 'halfpipe'
      strategy:
        type: Recreate
      template:
        metadata:
          annotations:
            alpha.image.policy.openshift.io/resolve-names: '*'
            io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
          labels:
            app: 'halfpipe'
            deployment: 'halfpipe'
        spec:
          shareProcessNamespace: true
          automountServiceAccountToken: false
          containers:
            - image: '${HALFPIPE_IMAGE}'
              imagePullPolicy: IfNotPresent
              name: halfpipe
              env:
                - name: OMP_NUM_THREADS
                  value: '2'
                - name: ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS
                  value: '2'
                - name: MKL_NUM_THREADS
                  value: '2'
                - name: OPENBLAS_NUM_THREADS
                  value: '2'
                - name: NUMEXPR_NUM_THREADS
                  value: '2'
              resources:
                limits:
                  cpu: '32'
                  memory: 200Gi
                requests:
                  cpu: '4'
                  memory: 8Gi
              volumeMounts:
                - mountPath: /home/fmriprep/data
                  name: data
          runtimeClassName: selinux
          serviceAccountName: anyuid
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: '${APPLICATION_NAME}'

  # === FileBrowser ===
  - apiVersion: v1
    kind: Service
    metadata:
      name: '${APPLICATION_NAME}-filebrowser'
      labels:
        app: '${APPLICATION_NAME}-filebrowser'
    spec:
      selector:
        app: '${APPLICATION_NAME}-filebrowser'
      ports:
        - name: "80-tcp"
          protocol: TCP
          port: 80
          targetPort: 80
      type: ClusterIP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: '${APPLICATION_NAME}-filebrowser'
      labels:
        app: '${APPLICATION_NAME}-filebrowser'
    spec:
      to:
        kind: Service
        name: '${APPLICATION_NAME}-filebrowser'
      port:
        targetPort: "80-tcp"
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: '${APPLICATION_NAME}-filebrowser'
      labels:
        app: '${APPLICATION_NAME}-filebrowser'
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: '${APPLICATION_NAME}-filebrowser'
      template:
        metadata:
          annotations:
            io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
          labels:
            app: '${APPLICATION_NAME}-filebrowser'
            deployment: '${APPLICATION_NAME}-filebrowser'
        spec:
          runtimeClassName: selinux
          serviceAccountName: anyuid
          automountServiceAccountToken: false
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: '${APPLICATION_NAME}'
            - name: filebrowser-db
              emptyDir: {}
          # Seed the FileBrowser database with an admin user using the same
          # password as the Ubuntu VNC application (from the app Secret),
          # so both stay in sync when the template is instantiated.
          # The filebrowser image has no shell, so each step is its own initContainer
          # calling the binary directly via `args` (the image's own entrypoint),
          # not `command`, since that binary is not on $PATH.
          initContainers:
            - name: init-filebrowser-db
              image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
              args:
                - "-d"
                - "/database/filebrowser.db"
                - "config"
                - "init"
              volumeMounts:
                - name: filebrowser-db
                  mountPath: /database
            - name: init-filebrowser-user
              image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
              args:
                - "-d"
                - "/database/filebrowser.db"
                - "users"
                - "add"
                - "admin"
                - "$(PASSWORD)"
                - "--perm.admin"
              env:
                - name: PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: application-password
                      name: '${APPLICATION_NAME}'
              volumeMounts:
                - name: filebrowser-db
                  mountPath: /database
          containers:
            - name: filebrowser
              image: ghcr.io/maastrichtu-ids/filebrowser:v2.11.0
              imagePullPolicy: IfNotPresent
              args:
                - "--root"
                - "/data"
                - "--database"
                - "/database/filebrowser.db"
              ports:
                - containerPort: 80
                  protocol: TCP
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: filebrowser-db
                  mountPath: /database
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: '1'
                  memory: 2Gi
                  ephemeral-storage: 5Gi

parameters:
  - name: APPLICATION_NAME
    displayName: Application name
    description: 'Must be without spaces (use -), and unique in the project.'
    value: ubuntu-vnc-halfpipe
    required: true
  - name: PASSWORD
    displayName: Ubuntu Password
    description: The password of your user and to access Ubuntu from the web UI
    required: true
  - name: STORAGE_SIZE
    displayName: Storage size
    description: Size of the storage shared by the Ubuntu and HALFPipe workspaces.
    value: 10Gi
    required: true
  - name: APPLICATION_IMAGE
    displayName: Ubuntu Docker image
    description: The Docker image for the Ubuntu VNC desktop.
    value: 'ghcr.io/maastrichtu-library/ubuntu-vnc:22.04'
    required: true
  - name: HALFPIPE_IMAGE
    displayName: Halfpipe Docker image
    description: The Docker image for Halfpipe.
    value: 'halfpipe/halfpipe:1.3.2'
    required: true
labels:
  template: ubuntu-vnc-halfpipe-filebrowser