#      admin_password: a-different-admin-password-of-32-chars  # min. 32 chars; admins MUST log in with this
#    Authenticator:
#      admin_users:
#        - admin
#      allowed_users:
#        - user1
#
# --- Option B: GitHub OAuth
#    JupyterHub:
