  containerSecurityContext:
    runAsUser: null
    runAsGroup: null
  podSecurityContext:
    fsGroup: null
  networkPolicy:
    enabled: false
  resources:
    requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}
    limits:   {cpu: "1",  memory: 1Gi,   ephemeral-storage: 1Gi}

proxy:
  chp:
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    networkPolicy:
      enabled: false
    resources:
      requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi}
      limits:   {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}

prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false

scheduling:
  userScheduler:
    enabled: false
  userPlaceholder:
    enabled: false

singleuser:
  uid: null
  fsGid: null
  cloudMetadata:
    blockWithIptables: false 
  networkPolicy:
    enabled: false
  storage:
    capacity: 2Gi
    dynamic:
      storageClass: ocs-storagecluster-cephfs
  cpu:
    guarantee: 0.5
    limit: 2
  memory:
    guarantee: 1G
    limit: 4G
  extraResource:
    guarantees:
      ephemeral-storage: 1Gi
    limits:
      ephemeral-storage: 10Gi